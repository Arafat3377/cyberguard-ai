{% extends 'base.html' %}{% block title %}AI Assistant{% endblock %}{% block content %}<h2>AI Security Assistant</h2><p class="text-secondary">Ask questions about the incidents stored in the platform.</p><div class="card"><div class="card-body"><form method="post">{% csrf_token %}<textarea name="question" class="form-control mb-3" rows="3" placeholder="e.g. How many high severity incidents are there?" required></textarea><button class="btn btn-primary">Ask Assistant</button></form>{% if answer %}<div class="assistant-answer mt-4"><h6>Assistant</h6><pre>{{ answer }}</pre></div>{% endif %}</div></div>{% endblock %}
