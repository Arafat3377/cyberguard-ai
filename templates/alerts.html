{% extends 'base.html' %}{% block title %}Alerts{% endblock %}{% block content %}<h2>Security Alerts</h2><div class="card mt-3"><div class="table-responsive"><table class="table"><thead><tr><th>Time</th><th>Severity</th><th>Message</th><th>Incident</th></tr></thead><tbody>{% for a in alerts %}<tr><td>{{ a.created_at|date:'Y-m-d H:i' }}</td><td><span class="severity {{ a.severity|lower }}">{{ a.severity }}</span></td><td>{{ a.message }}</td><td><a href="/events/{{ a.event.id }}/">{{ a.event.event_id }}</a></td></tr>{% empty %}<tr><td colspan="4">No alerts.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
